name: Build PRs

on:
  pull_request:
    branches:
      - develop
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: 'gradle'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew build --no-daemon
      - name: Upload test plugin JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DiscordSRV-StatusWebhook
          path: build/libs/DiscordSRV-1.30.5.jar
          if-no-files-found: error
          retention-days: 14
